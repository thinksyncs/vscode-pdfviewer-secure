name: Daily Pre-release Channel

on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: read
  security-events: read

concurrency:
  group: daily-pre-release-channel
  cancel-in-progress: false

jobs:
  daily-prerelease:
    name: Build and publish daily pre-release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve stable and daily versions
        id: version
        run: |
          STABLE_TAG="$(git tag --list 'v*.*.*' --sort=-version:refname | head -n 1)"
          if [ -z "$STABLE_TAG" ]; then
            STABLE_VERSION="$(node -p "require('./package.json').version")"
          else
            STABLE_VERSION="${STABLE_TAG#v}"
          fi

          DAILY_VERSION="$(STABLE_VERSION="$STABLE_VERSION" GITHUB_RUN_NUMBER="${{ github.run_number }}" node <<'NODE'
          const stable = process.env.STABLE_VERSION;
          const runNumber = Number(process.env.GITHUB_RUN_NUMBER);
          const parts = stable.split('.').map(Number);
          const [major = 0, minor = 0] = parts;
          console.log(`${major}.${minor + 1}.${runNumber}`);
          NODE
          )"

          echo "stable_tag=$STABLE_TAG" >> "$GITHUB_OUTPUT"
          echo "stable_version=$STABLE_VERSION" >> "$GITHUB_OUTPUT"
          echo "daily_version=$DAILY_VERSION" >> "$GITHUB_OUTPUT"
          echo "daily_tag=daily-prerelease" >> "$GITHUB_OUTPUT"
          echo "vsix_name=vscode-pdfviewer-secure-daily.vsix" >> "$GITHUB_OUTPUT"
      - name: Summarize open pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --state open --limit 20 --json number,title,isDraft,url > open-prs.json
          node <<'NODE' > open-prs.md
          const fs = require('fs');
          const prs = JSON.parse(fs.readFileSync('open-prs.json', 'utf8'));
          console.log('## Open pull requests');
          console.log('');
          if (prs.length === 0) {
            console.log('- None');
          } else {
            for (const pr of prs) {
              console.log(`- #${pr.number} ${pr.title} (${pr.isDraft ? 'draft' : 'open'}) - ${pr.url}`);
            }
          }
          console.log('');
          NODE
          cat open-prs.md >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize latest CodeQL run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list --workflow CodeQL --limit 1 --json displayTitle,status,conclusion,url,createdAt > codeql.json
          node <<'NODE' > codeql.md
          const fs = require('fs');
          const runs = JSON.parse(fs.readFileSync('codeql.json', 'utf8'));
          const run = runs[0];
          console.log('## Latest CodeQL run');
          console.log('');
          if (!run) {
            console.log('- No CodeQL run found');
          } else {
            console.log(`- ${run.displayTitle}`);
            console.log(`- Status: ${run.status}`);
            console.log(`- Conclusion: ${run.conclusion ?? 'n/a'}`);
            console.log(`- URL: ${run.url}`);
          }
          console.log('');
          NODE
          cat codeql.md >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize open Dependabot alerts
        id: alerts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh api "repos/${{ github.repository }}/dependabot/alerts?state=open&per_page=100" > dependabot-alerts.json 2>dependabot-alerts.err
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            {
              echo "## Open Dependabot alerts"
              echo
              echo "- Unavailable from GitHub Actions token in this run"
              echo
            } > dependabot.md
            echo "runtime_count=0" >> "$GITHUB_OUTPUT"
            cat dependabot.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node <<'NODE' > dependabot.md
          const fs = require('fs');
          const alerts = JSON.parse(fs.readFileSync('dependabot-alerts.json', 'utf8'));
          const runtimeAlerts = alerts.filter((alert) => alert.dependency?.scope !== 'development');
          const counts = alerts.reduce((acc, alert) => {
            const severity = alert.security_advisory?.severity ?? 'unknown';
            acc[severity] = (acc[severity] ?? 0) + 1;
            return acc;
          }, {});
          console.log('## Open Dependabot alerts');
          console.log('');
          console.log(`- Total: ${alerts.length}`);
          console.log(`- Runtime-scoped: ${runtimeAlerts.length}`);
          for (const severity of Object.keys(counts).sort()) {
            console.log(`- ${severity}: ${counts[severity]}`);
          }
          console.log('');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `runtime_count=${runtimeAlerts.length}\n`);
          NODE
          cat dependabot.md >> "$GITHUB_STEP_SUMMARY"

      - name: Audit shipped dependencies
        id: audit
        run: |
          set +e
          npm audit --omit=dev --audit-level=moderate --json > npm-audit-runtime.json
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          node <<'NODE' > runtime-audit.md
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('npm-audit-runtime.json', 'utf8'));
          const vulnerabilities = report.metadata?.vulnerabilities ?? {};
          console.log('## Runtime dependency audit');
          console.log('');
          console.log(`- Moderate: ${vulnerabilities.moderate ?? 0}`);
          console.log(`- High: ${vulnerabilities.high ?? 0}`);
          console.log(`- Critical: ${vulnerabilities.critical ?? 0}`);
          console.log('');
          NODE
          cat runtime-audit.md >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Stop on runtime security issues
        if: steps.alerts.outputs.runtime_count != '0' || steps.audit.outputs.status != '0'
        run: |
          echo "Runtime security checks reported issues. Daily pre-release will not be published."
          exit 1

      - name: Set daily build version
        run: npm version "${{ steps.version.outputs.daily_version }}" --no-git-tag-version

      - name: Run tests
        run: npm test

      - name: Package daily pre-release VSIX
        run: npx vsce package --pre-release --out "${{ steps.version.outputs.vsix_name }}"

      - name: Build daily release notes
        run: |
          {
            echo "# Daily pre-release"
            echo
            echo "- Channel: pre-release"
            echo "- Stable base: ${{ steps.version.outputs.stable_version }}"
            echo "- Daily version: ${{ steps.version.outputs.daily_version }}"
            echo "- Run number: ${{ github.run_number }}"
            echo
            cat open-prs.md
            cat codeql.md
            cat dependabot.md
            cat runtime-audit.md
          } > daily-release-notes.md

      - name: Move daily pre-release tag
        run: |
          git tag -f "${{ steps.version.outputs.daily_tag }}" "$GITHUB_SHA"
          git push origin "refs/tags/${{ steps.version.outputs.daily_tag }}" --force

      - name: Create or update GitHub daily pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TITLE="Daily pre-release (${{ steps.version.outputs.daily_version }})"
          if gh release view "${{ steps.version.outputs.daily_tag }}" >/dev/null 2>&1; then
            gh release edit "${{ steps.version.outputs.daily_tag }}" \
              --title "$RELEASE_TITLE" \
              --notes-file daily-release-notes.md \
              --prerelease
            gh release upload "${{ steps.version.outputs.daily_tag }}" "${{ steps.version.outputs.vsix_name }}" --clobber
          else
            gh release create "${{ steps.version.outputs.daily_tag }}" "${{ steps.version.outputs.vsix_name }}" \
              --title "$RELEASE_TITLE" \
              --notes-file daily-release-notes.md \
              --prerelease
          fi

      - name: Check publish secret
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: test -n "$VSCE_PAT" || { echo "VSCE_PAT is not set"; exit 1; }

      - name: Publish daily pre-release to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath "${{ steps.version.outputs.vsix_name }}" --pat "$VSCE_PAT" --pre-release --skip-duplicate
