name: Validate and Package VSIX

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:
    inputs:
      published_version:
        description: Optional Marketplace version to test offline (for example 2.4.0)
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  published-offline:
    name: Published VSIX Offline (VS Code ${{ matrix.vscode }})
    if: github.event_name == 'workflow_dispatch' && inputs.published_version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        vscode: ['1.111.0', stable]
    env:
      VSCODE_VERSION: ${{ matrix.vscode }}
      PUBLISHED_VERSION: ${{ inputs.published_version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Download and check the public VSIX
        run: |
          if [[ ! "$PUBLISHED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected a numeric Marketplace version.'
            exit 1
          fi
          PUBLIC_VSIX="$RUNNER_TEMP/marketplace.vsix"
          curl --fail --location --compressed --retry 3 --max-time 120 \
            "https://marketplace.visualstudio.com/_apis/public/gallery/publishers/ToppyMicroServices/vsextensions/vscode-pdfviewer-secure/$PUBLISHED_VERSION/vspackage" \
            -o "$PUBLIC_VSIX"
          PUBLIC_ROOT="$(mktemp -d "$RUNNER_TEMP/pdfviewer-public.XXXXXX")"
          python3 scripts/check-public-vsix.py "$PUBLIC_VSIX" "$PUBLIC_ROOT" "$PUBLISHED_VERSION"
          echo "VSCODE_EXTENSION_DEVELOPMENT_PATH=$PUBLIC_ROOT/extension" >> "$GITHUB_ENV"
      - name: Test the published VSIX without external networking
        run: npm run test:offline

  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm audit --audit-level=low

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  integration:
    name: Integration Test (VS Code ${{ matrix.vscode }}, ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        vscode:
          - '1.111.0'
          - stable
    env:
      VSCODE_VERSION: ${{ matrix.vscode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests without external networking
        run: npm run test:offline

  package:
    name: Package VSIX (ubuntu-latest)
    needs:
      - validate
      - integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VSIX_NAME: vscode-pdfviewer-secure-ci.vsix

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Run integration tests without external networking
        run: npm run test:offline

      - name: Package VSIX
        run: npm run package -- --out "$VSIX_NAME"

      - name: Test packaged VSIX without external networking
        run: |
          PACKAGED_EXTENSION_ROOT="$(mktemp -d "$RUNNER_TEMP/pdfviewer-vsix.XXXXXX")"
          python3 -m zipfile -e "$VSIX_NAME" "$PACKAGED_EXTENSION_ROOT"
          env VSCODE_EXTENSION_DEVELOPMENT_PATH="$PACKAGED_EXTENSION_ROOT/extension" npm run test:offline

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: ${{ env.VSIX_NAME }}
          if-no-files-found: error
