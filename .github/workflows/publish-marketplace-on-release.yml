name: Publish to VS Code Marketplace on Release

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish Marketplace Extension
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package VSIX
        run: npx vsce package --out vscode-pdfviewer-secure-${{ github.ref_name }}.vsix

      - name: Publish release build to Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath vscode-pdfviewer-secure-${{ github.ref_name }}.vsix --pat "$VSCE_PAT"
