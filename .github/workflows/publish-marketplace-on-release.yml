name: Publish Marketplace Manually

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag such as v2.0.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish Marketplace Package Manually
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Resolve release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be a version tag such as v2.0.6."
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VSIX_NAME=vscode-pdfviewer-secure-$VERSION.vsix" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.release_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm audit --audit-level=low

      - name: Verify requested tag matches package version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$PACKAGE_VERSION" = "$VERSION" || {
            echo "Requested version ($VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          }

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests without external networking
        run: npm run test:offline

      - name: Check publish secret
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          test -n "$VSCE_PAT" || { echo "VSCE_PAT is not set"; exit 1; }

      - name: Package VSIX
        run: npx vsce package --out "$VSIX_NAME"

      - name: Test packaged VSIX without external networking
        run: |
          PACKAGED_EXTENSION_ROOT="$(mktemp -d "$RUNNER_TEMP/pdfviewer-vsix.XXXXXX")"
          python3 -m zipfile -e "$VSIX_NAME" "$PACKAGED_EXTENSION_ROOT"
          env VSCODE_EXTENSION_DEVELOPMENT_PATH="$PACKAGED_EXTENSION_ROOT/extension" npm run test:offline

      - name: Publish release build to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath "$VSIX_NAME" --pat "$VSCE_PAT" --skip-duplicate
