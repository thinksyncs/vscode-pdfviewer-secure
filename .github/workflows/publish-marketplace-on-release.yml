name: Publish Extension Registries on Release

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish Extension Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check publish secrets
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          test -n "$VSCE_PAT" || { echo "VSCE_PAT is not set"; exit 1; }
          test -n "$OVSX_PAT" || { echo "OVSX_PAT is not set"; exit 1; }

      - name: Package VSIX
        run: npx vsce package --out vscode-pdfviewer-secure-${{ github.event.release.tag_name || github.ref_name }}.vsix

      - name: Publish release build to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath vscode-pdfviewer-secure-${{ github.event.release.tag_name || github.ref_name }}.vsix --pat "$VSCE_PAT"

      - name: Publish release build to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish vscode-pdfviewer-secure-${{ github.event.release.tag_name || github.ref_name }}.vsix -p "$OVSX_PAT"
