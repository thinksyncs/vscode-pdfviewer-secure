name: Publish Extension Registries Manually

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag such as v2.0.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish Extension Packages Manually
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Resolve release version
        run: |
          VERSION="${{ inputs.release_tag }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VSIX_NAME=vscode-pdfviewer-secure-$VERSION.vsix" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check publish secrets
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          test -n "$VSCE_PAT" || { echo "VSCE_PAT is not set"; exit 1; }
          test -n "$OVSX_PAT" || { echo "OVSX_PAT is not set"; exit 1; }

      - name: Package VSIX
        run: npx vsce package --out "$VSIX_NAME"

      - name: Publish release build to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath "$VSIX_NAME" --pat "$VSCE_PAT" --skip-duplicate

      - name: Publish release build to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish "$VSIX_NAME" -p "$OVSX_PAT"
